<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Visual Memory Injection - PIC Form</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc00ff;
            --neon-pink: #ff00ff;
            --dark-bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --error-red: #ff3e3e;
        }

        body {
            background: var(--dark-bg);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.1) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 50px 50px, 50px 50px;
        }

        .form-container {
            width: 480px;
            background: var(--glass);
            border: 1px solid var(--neon-cyan);
            padding: 50px;
            backdrop-filter: blur(20px);
            position: relative;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.1);
            animation: formEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Glitchy borders */
        .form-container::before,
        .form-container::after {
            content: "";
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid var(--neon-purple);
        }

        .form-container::before {
            top: -2px;
            left: -2px;
            border-right: 0;
            border-bottom: 0;
        }

        .form-container::after {
            bottom: -2px;
            right: -2px;
            border-left: 0;
            border-top: 0;
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--neon-cyan);
            margin-bottom: 40px;
            text-shadow: 0 0 15px var(--neon-cyan);
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        label {
            display: block;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #888;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 15px;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            box-sizing: border-box;
            transition: all 0.3s;
            border-left: 3px solid var(--neon-cyan);
        }

        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .error-msg {
            color: var(--error-red);
            font-size: 0.75rem;
            margin-top: 5px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(255, 62, 62, 0.5);
            animation: flicker 0.5s infinite alternate;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple));
            color: black;
            border: none;
            padding: 15px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 2px;
            transition: 0.4s;
            clip-path: polygon(0 0, 95% 0, 100% 15%, 100% 100%, 5% 100%, 0 85%);
            margin-top: 20px;
        }

        .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(188, 0, 255, 0.4);
            filter: brightness(1.2);
        }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #555;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .btn-back:hover {
            color: var(--neon-cyan);
        }

        @keyframes formEntry {
            from {
                opacity: 0;
                transform: scale(0.95);
                filter: blur(10px);
            }

            to {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        @keyframes flicker {
            0% {
                opacity: 0.8;
            }

            100% {
                opacity: 1;
            }
        }

        input.error-input {
            border-left-color: var(--error-red);
            border-bottom: 1px solid var(--error-red);
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2 th:text="${pic.id != null and pic.id != ''} ? 'MODIFY_DATA' : 'INJECT_DATA'">INJECT_DATA</h2>

        <form th:action="@{/api/pics/addupdate}" th:object="${pic}" method="POST" enctype="multipart/form-data">

            <!-- Hidden ID and URL (preserve during update if no new file) -->
            <input type="hidden" th:field="*{id}" th:if="${pic.id != null and pic.id != ''}">
            <input type="hidden" th:field="*{url}">
            <input type="hidden" th:field="*{fileSize}">

            <div class="form-group" th:if="${pic.id == null or pic.id == ''}">
                <label>Archive ID</label>
                <input type="text" th:field="*{id}" placeholder="unique_identifier"
                    th:classappend="${#fields.hasErrors('id')} ? 'error-input' : ''">
                <div class="error-msg" th:if="${#fields.hasErrors('id')}" th:errors="*{id}">ID Error</div>
            </div>

            <div class="form-group">
                <label>Visual Interface (Choose File)</label>
                <input type="file" name="imageFile" accept="image/*"
                    style="border-left: 3px solid var(--neon-pink); padding: 8px;">
                <small th:if="*{url != null and url != ''}"
                    style="color: var(--neon-cyan); display: block; margin-top: 5px; font-size: 0.7rem;">
                    Currently stored: [[*{url}]]
                </small>
            </div>

            <div class="form-group" th:if="*{fileSize != null}">
                <label>Recorded Magnitude (KB)</label>
                <div style="color: var(--neon-cyan); font-size: 1.2rem; font-weight: bold;" th:text="*{fileSize}">0
                </div>
            </div>

            <div class="form-group">
                <label>Semantic Label (Alt Text)</label>
                <input type="text" th:field="*{altText}" placeholder="Visual description..."
                    th:classappend="${#fields.hasErrors('altText')} ? 'error-input' : ''">
                <div class="error-msg" th:if="${#fields.hasErrors('altText')}" th:errors="*{altText}">Alt Error</div>
            </div>

            <button type="submit" class="btn-submit">Execute Injection</button>
        </form>

        <a th:href="@{/api/pics/}" class="btn-back">← Retract to Archive</a>
    </div>

</body>

</html>
