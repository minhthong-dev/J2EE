<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Visual Memory Archive - PIC Terminal</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc00ff;
            --dark-bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background: var(--dark-bg);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 40px;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(188, 0, 255, 0.1) 0%, transparent 50%),
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 10px;
            background: linear-gradient(to right, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            margin: 0;
        }

        .btn-add {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            transition: 0.4s;
            background: transparent;
            position: relative;
            overflow: hidden;
        }

        .btn-add:hover {
            background: var(--neon-cyan);
            color: black;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .pic-card {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0;
            padding: 15px;
            backdrop-filter: blur(10px);
            transition: 0.5s;
            position: relative;
            overflow: hidden;
        }

        .pic-card:hover {
            transform: translateY(-10px);
            border-color: var(--neon-purple);
            box-shadow: 0 10px 30px rgba(188, 0, 255, 0.2);
        }

        .img-container {
            width: 100%;
            height: 200px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
            position: relative;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.8s;
        }

        .pic-card:hover img {
            transform: scale(1.1);
        }

        .pic-info {
            padding: 10px 0;
        }

        .pic-id {
            font-size: 0.8rem;
            color: var(--neon-cyan);
            margin-bottom: 5px;
        }

        .pic-alt {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .pic-size {
            font-size: 0.9rem;
            color: #888;
        }

        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 8px;
            text-align: center;
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: bold;
            border: 1px solid;
            transition: 0.3s;
        }

        .btn-edit {
            color: var(--neon-cyan);
            border-color: var(--neon-cyan);
        }

        .btn-delete {
            color: #ff3e3e;
            border-color: #ff3e3e;
        }

        .btn-edit:hover {
            background: var(--neon-cyan);
            color: black;
        }

        .btn-delete:hover {
            background: #ff3e3e;
            color: white;
        }

        /* HUD elements */
        .corner {
            position: absolute;
            width: 10px;
            height: 10px;
            border: 2px solid var(--neon-cyan);
        }

        .tl {
            top: 0;
            left: 0;
            border-right: 0;
            border-bottom: 0;
        }

        .tr {
            top: 0;
            right: 0;
            border-left: 0;
            border-bottom: 0;
        }

        .bl {
            bottom: 0;
            left: 0;
            border-right: 0;
            border-top: 0;
        }

        .br {
            bottom: 0;
            right: 0;
            border-left: 0;
            border-top: 0;
        }

        .navbar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
        }

        .nav-link {
            color: #666;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .nav-link.active {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .nav-link:hover {
            color: white;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a th:href="@{/}" class="nav-link">Main Terminal</a>
        <a th:href="@{/api/books/}" class="nav-link">Text Archive</a>
        <a th:href="@{/api/pics/}" class="nav-link active">Visual Array</a>
    </nav>

    <div class="header">
        <h1>Visual Archive</h1>
        <a th:href="@{/api/pics/add-pic}" class="btn-add">Inject New Data</a>
    </div>

    <div class="gallery">
        <div th:each="p : ${pics}" class="pic-card">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>

            <div class="img-container">
                <!-- Hiển thị hình ảnh trực tiếp với th:src -->
                <img th:if="${p.url != null and p.url != ''}" th:src="${p.url}" th:alt="${p.altText}"
                    onerror="this.src='https://placehold.co/600x400/050505/00f3ff?text=MALFUNCTION'; this.classList.add('broken');">

                <div th:unless="${p.url != null and p.url != ''}" class="no-stream">
                    <div class="pulse-icon">⚠</div>
                    <span>NO_VISUAL_STREAM</span>
                </div>
            </div>

            <div class="pic-info">
                <div class="pic-id" th:text="'ARCHIVE_NODE: ' + ${p.id}">CORE_ID: 001</div>
                <div class="pic-alt" th:text="${p.altText}">Cybernetic Interface</div>
                <div class="pic-size" th:text="'DATA_MAGNITUDE: ' + ${p.fileSize} + ' KB'">STORAGE: 256 KB</div>
            </div>

            <div class="actions">
                <a th:href="@{/api/pics/update-pic/{id}(id=${p.id})}" class="btn-action btn-edit">Re-calibrate</a>
                <a th:href="@{/api/pics/delete/{id}(id=${p.id})}" class="btn-action btn-delete"
                    onclick="return confirm('Initiate protocol: PURGE?')">Terminate</a>
            </div>
        </div>
    </div>

    <style>
        /* Extra visual enhancements */
        .no-stream {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--neon-purple);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            background: rgba(188, 0, 255, 0.05);
        }

        .pulse-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
                text-shadow: 0 0 15px var(--neon-purple);
            }

            100% {
                transform: scale(1);
                opacity: 0.8;
            }
        }

        .img-container img.broken {
            filter: grayscale(1) contrast(1.5) brightness(0.5);
            border: 1px dashed var(--neon-purple);
        }
    </style>

</body>

</html>
