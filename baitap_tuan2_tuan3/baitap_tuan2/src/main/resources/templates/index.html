<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Node Alpha - Terminal</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc00ff;
            --dark-bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(188, 0, 255, 0.1) 0%, transparent 50%),
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 4.5rem;
            text-transform: uppercase;
            letter-spacing: 15px;
            background: linear-gradient(to right, var(--neon-cyan), var(--neon-purple), var(--neon-cyan));
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: flow 5s linear infinite;
            margin-bottom: 60px;
            position: relative;
        }

        @keyframes flow {
            to {
                background-position: 200% center;
            }
        }

        .container {
            display: flex;
            gap: 50px;
        }

        .node-card {
            width: 280px;
            height: 350px;
            background: var(--glass);
            border: 1px solid rgba(0, 243, 255, 0.2);
            backdrop-filter: blur(15px);
            padding: 30px;
            text-align: center;
            text-decoration: none;
            color: white;
            position: relative;
            transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .node-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(0, 243, 255, 0.1), transparent);
            transform: translateX(-100%);
            transition: 0.6s;
        }

        .node-card:hover {
            transform: translateY(-20px) scale(1.05);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.2);
        }

        .node-card:hover::before {
            transform: translateX(100%);
        }

        .node-card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            margin: 0;
            letter-spacing: 3px;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .node-card p {
            margin-top: 20px;
            font-size: 1rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        /* Glitch Effect */
        .glitch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0, 243, 255, 0.03) 0px, transparent 1px, transparent 2px);
        }

        .stark-tag {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 4px;
        }

        .circle-deco {
            position: absolute;
            width: 400px;
            height: 400px;
            border: 1px solid rgba(0, 243, 255, 0.05);
            border-radius: 50%;
            animation: spin 20s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="glitch-overlay"></div>
    <div class="circle-deco"></div>

    <h1 class="hero-title">MAIN_TERMINAL</h1>

    <div class="container">
        <a th:href="@{/api/books/}" class="node-card">
            <h2>TEXT_ARCHIVE</h2>
            <p>Node_01 // Books</p>
        </a>

        <a th:href="@{/api/pics/}" class="node-card">
            <h2>VISUAL_ARRAY</h2>
            <p>Node_02 // Images</p>
        </a>
    </div>

    <div class="stark-tag">SYSTEM_OS_V4.0.2</div>
</body>

</html>
