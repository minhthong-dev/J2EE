<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Text Archive Node - Alpha</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc00ff;
            --dark-bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 40px;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 10px;
            color: var(--neon-cyan);
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            margin: 0;
        }

        .navbar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
        }

        .nav-link {
            color: #666;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .nav-link.active {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .btn-add {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 30px;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            transition: 0.4s;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        .btn-add:hover {
            background: var(--neon-cyan);
            color: black;
            box-shadow: 0 0 30px var(--neon-cyan);
        }

        .archive-container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2px;
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(0, 243, 255, 0.1);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            padding: 20px;
            border-bottom: 2px solid var(--neon-cyan);
        }

        td {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 1.1rem;
            color: #ddd;
            transition: 0.3s;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .book-thumb {
            width: 60px;
            height: 85px;
            object-fit: cover;
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .btn {
            padding: 8px 15px;
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            transition: 0.3s;
            display: inline-block;
        }

        .btn-edit {
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
        }

        .btn-delete {
            color: #ff3e3e;
            border: 1px solid #ff3e3e;
            margin-left: 10px;
        }

        .btn-edit:hover {
            background: var(--neon-cyan);
            color: black;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .btn-delete:hover {
            background: #ff3e3e;
            color: white;
            box-shadow: 0 0 15px #ff3e3e;
        }

        /* HUD elements */
        .corner {
            position: absolute;
            width: 10px;
            height: 10px;
            border: 2px solid var(--neon-cyan);
        }

        .tl {
            top: -2px;
            left: -2px;
            border-right: 0;
            border-bottom: 0;
        }

        .tr {
            top: -2px;
            right: -2px;
            border-left: 0;
            border-bottom: 0;
        }

        .bl {
            bottom: -2px;
            left: -2px;
            border-right: 0;
            border-top: 0;
        }

        .br {
            bottom: -2px;
            right: -2px;
            border-left: 0;
            border-top: 0;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a th:href="@{/}" class="nav-link">Main Terminal</a>
        <a th:href="@{/api/books/}" class="nav-link active">Text Archive</a>
        <a th:href="@{/api/pics/}" class="nav-link">Visual Array</a>
    </nav>

    <div class="header">
        <h1>Text Archive Nodes</h1>
        <a th:href="@{/api/books/add-book}" class="btn-add">▲ Initialize New Data</a>
    </div>

    <div class="archive-container">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <table>
            <thead>
                <tr>
                    <th>Hash_ID</th>
                    <th>Node_Visual</th>
                    <th>Identity</th>
                    <th>Origin_Source</th>
                    <th>Credit_Cost</th>
                    <th>Control_Panel</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.id}" style="font-family: 'Orbitron', sans-serif;">001</td>
                    <td>
                        <img th:if="${book.url != null and book.url != ''}" th:src="${book.url}" class="book-thumb"
                            alt="Visual">
                        <span th:unless="${book.url != null and book.url != ''}" style="color: #444;">NO_VISUAL</span>
                    </td>
                    <td th:text="${book.title}" style="color: var(--neon-cyan); font-weight: bold;">Tên sách</td>
                    <td th:text="${book.author}">Tác giả</td>
                    <td th:text="${book.price} + ' CR'">100 CR</td>
                    <td>
                        <a th:href="@{/api/books/update-book/{id}(id=${book.id})}" class="btn btn-edit">Recalibrate</a>
                        <a th:href="@{/api/books/delete/{id}(id=${book.id})}" class="btn btn-delete"
                            onclick="return confirm('Initiate protocol: PURGE_DATA?')">Purge</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>

</html>
