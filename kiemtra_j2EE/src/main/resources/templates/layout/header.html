<aside class="sidebar" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="header(activeTab)">
    <h2>Admin Panel</h2>
    
    <!-- User Profile Section -->
    <div style="background: #f8fafc; padding: 1rem; border-radius: 0.75rem; margin-bottom: 2rem; border: 1px solid var(--border-color);">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
            <div style="width: 40px; height: 40px; background: var(--primary-color); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700;">
                <span th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">U</span>
            </div>
            <div>
                <div style="font-size: 0.875rem; font-weight: 700;" sec:authentication="name">User</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">Administrator</div>
            </div>
        </div>
    </div>

    <ul class="sidebar-nav">
        <li th:class="${activeTab == 'home' ? 'nav-home' : ''}"><a th:href="@{/}">Dashboard</a></li>
        <li th:class="${activeTab == 'category' ? 'nav-category' : ''}"><a th:href="@{/category-ui/}">Categories</a></li>
        <li th:class="${activeTab == 'product' ? 'nav-product' : ''}"><a th:href="@{/products-ui/}">Products</a></li>
        <li style="margin-top: 2rem;">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline" style="color: var(--danger); border-color: #fee2e2; width: 100%; justify-content: flex-start;">
                    Logout
                </button>
            </form>
        </li>
    </ul>
</aside>
