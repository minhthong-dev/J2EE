<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Danh mục - Admin CMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .sidebar-nav li.nav-category a { background-color: #f1f5f9; color: var(--primary-color); font-weight: 600; }
    </style>
</head>
<body>
    <div th:replace="~{layout/header :: header('category')}"></div>

    <main>
        <div class="header">
            <h1>Categories</h1>
            <button class="btn btn-primary" onclick="openModal('add')">+ Add Category</button>
        </div>

        <table class="glass-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="categoryTable">
                <!-- Data will be loaded via Fetch API -->
            </tbody>
        </table>

        <footer th:replace="~{layout/footer :: footer}"></footer>
    </main>

    <!-- Category Modal -->
    <div id="categoryModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Add Category</h2>
            <form id="categoryForm">
                <input type="hidden" id="categoryId">
                <div class="form-group">
                    <label for="categoryName">Category Name</label>
                    <input type="text" id="categoryName" class="form-input" required placeholder="e.g. Electronics">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '/api/category/';

        async function fetchCategories() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                renderTable(data);
            } catch (err) {
                console.error("Error fetching categories:", err);
            }
        }

        function renderTable(categories) {
            const tableBody = document.getElementById('categoryTable');
            tableBody.innerHTML = categories.map(cat => `
                <tr>
                    <td>#${cat.id}</td>
                    <td class="font-600">${cat.name}</td>
                    <td style="display: flex; gap: 0.5rem;">
                        <button class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;" onclick="openModal('edit', ${cat.id}, '${cat.name}')">Edit</button>
                        <button class="btn btn-danger" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;" onclick="deleteCategory(${cat.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function openModal(mode, id = null, name = '') {
            const modal = document.getElementById('categoryModal');
            document.getElementById('modalTitle').innerText = mode === 'add' ? 'Add New Category' : 'Edit Category';
            document.getElementById('categoryId').value = id || '';
            document.getElementById('categoryName').value = name || '';
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('categoryModal').style.display = 'none';
        }

        document.getElementById('categoryForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('categoryId').value;
            const name = document.getElementById('categoryName').value;
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}${id}` : API_URL;

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });

                if (res.ok) {
                    closeModal();
                    fetchCategories();
                } else {
                    const error = await res.json();
                    alert(error.message || "Something went wrong!");
                }
            } catch (err) {
                console.error("Error saving category:", err);
            }
        };

        async function deleteCategory(id) {
            if (!confirm('Are you sure you want to delete this category?')) return;
            try {
                const res = await fetch(`${API_URL}${id}`, { method: 'DELETE' });
                if (res.ok) fetchCategories();
            } catch (err) {
                console.error("Error deleting category:", err);
            }
        }

        // Initial load
        window.onclick = (e) => {
            const modal = document.getElementById('categoryModal');
            if (e.target === modal) closeModal();
        };
        fetchCategories();
    </script>
</body>
</html>
