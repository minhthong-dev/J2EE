<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Sản phẩm - Admin CMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .sidebar-nav li.nav-product a { background-color: #f1f5f9; color: var(--primary-color); font-weight: 600; }
    </style>
</head>
<body>
    <div th:replace="~{layout/header :: header('product')}"></div>

    <main>
        <div class="header">
            <h1>Products</h1>
            <button class="btn btn-primary" onclick="openModal('add')">+ Add Product</button>
        </div>

        <table class="glass-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="productTable">
                <!-- Data will be loaded via Fetch API -->
            </tbody>
        </table>

        <footer th:replace="~{layout/footer :: footer}"></footer>
    </main>

    <!-- Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Add Product</h2>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <input type="text" id="productName" class="form-input" required placeholder="e.g. MacBook Pro">
                </div>
                <div class="form-group">
                    <label for="productPrice">Price ($)</label>
                    <input type="number" step="0.01" id="productPrice" class="form-input" required placeholder="e.g. 1999.99">
                </div>
                <div class="form-group">
                    <label for="productCategory">Category</label>
                    <select id="productCategory" class="form-input" required>
                        <!-- Categories will be loaded via Fetch API -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="productDesc">Description</label>
                    <textarea id="productDesc" class="form-input" style="min-height: 80px;" placeholder="Optional details..."></textarea>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '/api/products/';
        const CAT_API_URL = '/api/category/';

        let categories = [];

        async function init() {
            await fetchCategories();
            await fetchProducts();
        }

        async function fetchCategories() {
            try {
                const res = await fetch(CAT_API_URL);
                categories = await res.json();
                const selectElement = document.getElementById('productCategory');
                selectElement.innerHTML = categories.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');
            } catch (err) {
                console.error("Error fetching categories:", err);
            }
        }

        async function fetchProducts() {
            try {
                const res = await fetch(API_URL);
                const result = await res.json();
                renderTable(result.data);
            } catch (err) {
                console.error("Error fetching products:", err);
            }
        }

        function renderTable(products) {
            const tableBody = document.getElementById('productTable');
            tableBody.innerHTML = products.map(p => `
                <tr>
                    <td>#${p.id}</td>
                    <td class="font-600">${p.name}</td>
                    <td>$${p.price.toFixed(2)}</td>
                    <td><span class="badge badge-blue">${p.category ? p.category.name : 'N/A'}</span></td>
                    <td style="color: var(--text-muted); font-size: 0.8rem;">${p.description || '-'}</td>
                    <td style="display: flex; gap: 0.5rem;">
                        <button class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;" onclick="openModal('edit', ${p.id}, '${p.name}', ${p.price}, ${p.category ? p.category.id : ''}, '${p.description || ''}')">Edit</button>
                        <button class="btn btn-danger" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;" onclick="deleteProduct(${p.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function openModal(mode, id = null, name = '', price = '', categoryId = '', desc = '') {
            const modal = document.getElementById('productModal');
            document.getElementById('modalTitle').innerText = mode === 'add' ? 'Add New Product' : 'Edit Product';
            document.getElementById('productId').value = id || '';
            document.getElementById('productName').value = name || '';
            document.getElementById('productPrice').value = price || '';
            document.getElementById('productCategory').value = categoryId || (categories[0] ? categories[0].id : '');
            document.getElementById('productDesc').value = desc || '';
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        document.getElementById('productForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const name = document.getElementById('productName').value;
            const price = parseFloat(document.getElementById('productPrice').value);
            const categoryId = parseInt(document.getElementById('productCategory').value);
            const description = document.getElementById('productDesc').value;

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}${id}` : API_URL;

            const productData = {
                name,
                price,
                description,
                category: { id: categoryId }
            };

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(productData)
                });

                if (res.ok) {
                    closeModal();
                    fetchProducts();
                } else {
                    alert("Error saving product. Check server logs.");
                }
            } catch (err) {
                console.error("Error saving product:", err);
            }
        };

        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            try {
                const res = await fetch(`${API_URL}${id}`, { method: 'DELETE' });
                if (res.ok) fetchProducts();
            } catch (err) {
                console.error("Error deleting product:", err);
            }
        }

        window.onclick = (e) => {
            const modal = document.getElementById('productModal');
            if (e.target === modal) closeModal();
        };

        // Start initialization
        init();
    </script>
</body>
</html>
