<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-success">Hệ thống Quản lý Sản phẩm</h2>
            <div sec:authorize="isAuthenticated()" class="text-end">
                <span class="me-3 text-muted">Xin chào, <strong sec:authentication="name">User</strong>!</span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Đăng xuất</button>
                </form>
            </div>
        </div>

        <a href="/" class="btn btn-secondary mb-4">← Quay lại Trang chủ</a>

        <!-- Form Thêm/Sửa Sản phẩm (Chỉ ADMIN mới thấy form lưu) -->
        <div class="card shadow-sm mb-4" sec:authorize="hasRole('ADMIN')">
            <div class="card-header bg-white">
                <h5 class="card-title my-1" id="formTitle">Thêm Sản phẩm mới</h5>
            </div>
            <div class="card-body">
                <form id="productForm">
                    <input type="hidden" id="productId">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="productName" class="form-label">Tên Sản phẩm <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="productName" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="productPrice" class="form-label">Giá (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" class="form-control" id="productPrice" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="productPath" class="form-label">Đường dẫn Hình ảnh (Path)</label>
                        <input type="text" class="form-control" id="productPath" placeholder="VD: /images/product1.jpg">
                    </div>
                    <button type="submit" class="btn btn-primary">Lưu Sản phẩm</button>
                    <button type="button" class="btn btn-outline-secondary ms-2" onclick="resetForm()">Hủy</button>
                </form>
            </div>
        </div>

        <!-- Danh sách Sản phẩm -->
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover table-bordered text-center align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Tên Sản phẩm</th>
                            <th>Giá (VNĐ)</th>
                            <th>Đường dẫn ảnh</th>
                            <th sec:authorize="hasRole('ADMIN')">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                        <tr><td colspan="5">Đang nạp dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/products';

        // Lấy danh sách sản phẩm
        async function fetchProducts() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error("Lỗi tải danh sách");
                const products = await res.json();
                const tbody = document.getElementById('productTableBody');
                tbody.innerHTML = '';

                if (products.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5">Chưa có sản phẩm nào.</td></tr>';
                    return;
                }

                products.forEach(p => {
                    const pathStr = p.path ? p.path : '<span class="text-muted fst-italic">Trống</span>';
                    
                    // Kiểm tra xem user có phải admin để hiện nút sửa/xóa không
                    const isAdmin = [[${#authorization.expression('hasRole(''ADMIN'')')}]];
                    
                    let actionsHtml = '';
                    if (isAdmin) {
                        actionsHtml = `
                            <td>
                                <button class="btn btn-sm btn-warning" onclick="editProduct(${p.id}, '${p.name}', ${p.price}, '${p.path || ''}')">Sửa</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">Xóa</button>
                            </td>`;
                    } else {
                        actionsHtml = ``; // Không render cột hành động cho User
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td>${p.id}</td>
                            <td class="text-start">${p.name}</td>
                            <td class="text-success fw-bold">${p.price.toLocaleString()}</td>
                            <td>${pathStr}</td>
                            ${actionsHtml}
                        </tr>`;
                });
            } catch (error) {
                console.error(error);
                document.getElementById('productTableBody').innerHTML = '<tr><td colspan="5" class="text-danger">Không thể kết nối Server!</td></tr>';
            }
        }

        // Xử lý gửi Form (Thêm/Sửa)
        const productForm = document.getElementById('productForm');
        if (productForm) {
            productForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = document.getElementById('productId').value;
                const name = document.getElementById('productName').value;
                const price = document.getElementById('productPrice').value;
                const path = document.getElementById('productPath').value;

                const method = id ? 'PUT' : 'POST';
                const url = id ? `${API_URL}/${id}` : API_URL;

                try {
                    const res = await fetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, price: parseFloat(price), path })
                    });

                    if (res.ok) {
                        alert('Đã lưu thành công!');
                        resetForm();
                        fetchProducts();
                    } else {
                        alert('Lỗi: Bạn không có quyền hoặc dữ liệu không hợp lệ.');
                    }
                } catch (error) {
                    alert('Lỗi kết nối Server!');
                }
            });
        }

        function editProduct(id, name, price, path) {
            document.getElementById('productId').value = id;
            document.getElementById('productName').value = name;
            document.getElementById('productPrice').value = price;
            document.getElementById('productPath').value = path;
            document.getElementById('formTitle').innerText = 'Cập nhật Sản phẩm';
            window.scrollTo(0, 0);
        }

        function resetForm() {
            if (productForm) productForm.reset();
            document.getElementById('productId').value = '';
            document.getElementById('formTitle').innerText = 'Thêm Sản phẩm mới';
        }

        async function deleteProduct(id) {
            if (confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')) {
                try {
                    const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                    if (res.ok) fetchProducts();
                    else alert('Xóa thất bại! Có thể bạn không có quyền ADMIN.');
                } catch (error) {
                    alert('Lỗi kết nối!');
                }
            }
        }

        fetchProducts();
    </script>
</body>
</html>
