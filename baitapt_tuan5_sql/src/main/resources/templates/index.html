<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Sản phẩm và Danh mục</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Hệ thống Quản lý Bán Hàng</h1>
        <div sec:authorize="isAuthenticated()" class="text-end">
            <span class="me-3">Xin chào, <strong sec:authentication="name">User</strong>!</span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger btn-sm">Đăng xuất</button>
            </form>
        </div>
    </div>
    <div class="mt-4 p-5 bg-white shadow-sm rounded">
        <h4 class="mb-4 text-muted">Vui lòng chọn chức năng:</h4>
        <a href="/categories-ui" class="btn btn-primary btn-lg mx-2">Quản lý Danh mục (Categories)</a>
        <a href="/products" class="btn btn-success btn-lg mx-2">Quản lý Sản phẩm (Products)</a>
    </div>
</div>
</body>
</html>
